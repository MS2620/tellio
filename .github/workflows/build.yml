name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**"]   # text-only edits don't need a build
  pull_request:
  workflow_dispatch:

# A newer push cancels the build still running for an older one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  # Free: compiles the app (unsigned) on every push so you know the code builds.
  build:
    runs-on: xcode-27  # AetherEngine needs Xcode 27
    permissions:
      contents: write   # to publish the pre-release below
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so file dates can be restored below

      # Reuse downloaded packages (AetherEngine, FFmpeg…) and their compiled
      # output from the last build, so only Tellio's own code recompiles.
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: build
          key: derived-${{ runner.os }}-${{ hashFiles('project.yml') }}-${{ github.sha }}
          restore-keys: |
            derived-${{ runner.os }}-${{ hashFiles('project.yml') }}-
            derived-${{ runner.os }}-

      # Only recompile what changed. A fresh checkout stamps every file with the current
      # time, so Xcode would think everything changed. Files unchanged since the cached
      # build get a fixed old date (the same one every run); files changed since then get
      # the current time, so only those are recompiled.
      - name: Mark changed files
        run: |
          python3 - <<'PY'
          import os, subprocess, time
          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True)
          files = git("ls-files").stdout.splitlines()
          built = open("build/.tellio-built-sha").read().strip() if os.path.exists("build/.tellio-built-sha") else ""
          diff = git("diff", "--name-only", built, "HEAD") if built else None
          if diff is None or diff.returncode != 0:
              changed = set(files)   # no usable cache: everything counts as changed
              print("No earlier build to compare with; building everything")
          else:
              changed = set(diff.stdout.splitlines())
              print(f"Changed since {built[:7]}: {len(changed)} files")
          old, now = 1577836800, time.time()   # 1 Jan 2020
          for name in files:
              if os.path.isfile(name):
                  stamp = now if name in changed else old
                  os.utime(name, (stamp, stamp))
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # The exact library versions, shown in Settings › About › Acknowledgements.
      - name: Read library versions
        run: |
          xcodebuild -resolvePackageDependencies -project Tellio.xcodeproj -scheme Tellio -derivedDataPath build > /dev/null
          python3 - >> "$GITHUB_ENV" <<'PY'
          import json
          pins = json.load(open("Tellio.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved")).get("pins", [])
          pairs = [f"{p['identity']}={p.get('state', {}).get('version', '')}" for p in pins]
          print("LIBRARY_VERSIONS=" + ",".join(pairs))
          PY
          grep LIBRARY_VERSIONS "$GITHUB_ENV"

      # Scramble the built-in TMDB token so it isn't plain text in the app file.
      # The app unscrambles it (AppSettings.builtInTMDBToken); TOKEN_MASK must match it there.
      - name: Scramble built-in keys
        env:
          TMDB_TOKEN_PLAIN: ${{ secrets.TMDB_TOKEN }}
          TOKEN_MASK: T3ll10-sh3lf-m4sk-2026
        run: |
          SCRAMBLED=$(python3 - <<'PY'
          import base64, os
          token, mask = os.environ.get("TMDB_TOKEN_PLAIN", "").strip().encode(), os.environ["TOKEN_MASK"].encode()
          print("x1:" + base64.b64encode(bytes(b ^ mask[i % len(mask)] for i, b in enumerate(token))).decode() if token else "")
          PY
          )
          # Keep it out of the public build logs too.
          [ -n "$SCRAMBLED" ] && echo "::add-mask::$SCRAMBLED"
          echo "TMDB_TOKEN_SCRAMBLED=$SCRAMBLED" >> "$GITHUB_ENV"

      - name: Build for tvOS (unsigned)
        run: |
          # The version ends in the build number (0.1.0 becomes 0.1.12), so sideloaders that look
          # for updates by version see each build as newer. Change "0.1" in project.yml.
          VERSION="$(sed -n 's/^ *MARKETING_VERSION: "\([0-9]*\.[0-9]*\).*/\1/p' project.yml).${{ github.run_number }}"
          xcodebuild -version
          xcodebuild \
            -project Tellio.xcodeproj \
            -scheme Tellio \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION="$VERSION" \
            SWIFT_COMPILATION_MODE=singlefile \
            TRAKT_CLIENT_ID="${{ secrets.TRAKT_CLIENT_ID }}" \
            TMDB_TOKEN="$TMDB_TOKEN_SCRAMBLED" \
            SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            FEEDBACK_URL="${{ secrets.FEEDBACK_URL }}" \
            LIBRARY_VERSIONS="$LIBRARY_VERSIONS" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            build
          # Remember what this cache was built from, for "Mark changed files" next time.
          echo "${{ github.sha }}" > build/.tellio-built-sha
      
      # Shows whether the app icon made it into the build. Never fails the build.
      - name: Check app icon in the build
        run: |
          APP=build/Build/Products/Release-appletvos/Tellio.app
          echo "--- Version ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" "$APP/Info.plist"
          if [ -n "$(/usr/libexec/PlistBuddy -c "Print :TraktClientID" "$APP/Info.plist" 2>/dev/null)" ]; then echo "Trakt: built-in Client ID present"; else echo "Trakt: no built-in Client ID (add the TRAKT_CLIENT_ID secret)"; fi
          if [ -n "$(/usr/libexec/PlistBuddy -c "Print :TMDBToken" "$APP/Info.plist" 2>/dev/null)" ]; then echo "TMDB: built-in token present"; else echo "TMDB: no built-in token (add the TMDB_TOKEN secret)"; fi
          if [ -n "$(/usr/libexec/PlistBuddy -c "Print :SentryDSN" "$APP/Info.plist" 2>/dev/null)" ]; then echo "Crash reports: on"; else echo "Crash reports: off (add the SENTRY_DSN secret)"; fi
          if [ -n "$(/usr/libexec/PlistBuddy -c "Print :FeedbackURL" "$APP/Info.plist" 2>/dev/null)" ]; then echo "Feedback: on"; else echo "Feedback: off (add the FEEDBACK_URL secret)"; fi
          echo "--- Info.plist icon keys ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP/Info.plist" || echo "No CFBundleIcons in Info.plist"
          /usr/libexec/PlistBuddy -c "Print :TVTopShelfImage" "$APP/Info.plist" || echo "No TVTopShelfImage in Info.plist"
          echo "--- Files in the app ---"
          ls "$APP" | head -50
          echo "--- Icon assets in Assets.car ---"
          xcrun --sdk appletvos assetutil --info "$APP/Assets.car" | grep -E '"(Name|AssetType|Idiom)"' | sort | uniq -c | head -60 || echo "No Assets.car"

      # Symbol files, so crash reports show function names and lines. Skipped until the
      # SENTRY_AUTH_TOKEN secret and SENTRY_ORG variable are set. Never fails the build.
      - name: Upload debug symbols to Sentry
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'tellio' }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ]; then
            echo "Skipped: add the SENTRY_AUTH_TOKEN secret and SENTRY_ORG variable"; exit 0
          fi
          npx --yes @sentry/cli@2 debug-files upload --include-sources build/Build/Products/Release-appletvos

      # Unsigned IPA for sideloading (Sideloadly / atvloadly re-sign it with your Apple ID)
      # Pseudo-sign (ldid) the app and its Top Shelf extension with their entitlements.
      # It's not a real signature, but it tells atvloadly/Impactor which App Group
      # to register when it re-signs; without it the Top Shelf can't share data.
      - name: Package IPA with entitlements
        run: |
          brew install ldid
          rm -rf Payload && mkdir -p Payload
          cp -R build/Build/Products/Release-appletvos/Tellio.app Payload/
          APP=Payload/Tellio.app
          ldid -SConfig/TellioTopShelf.entitlements "$APP/PlugIns/TellioTopShelf.appex/TellioTopShelf"
          ldid -SConfig/Tellio.entitlements "$APP/Tellio"
          echo "--- Entitlements now in the app ---"
          ldid -e "$APP/Tellio"
          ldid -e "$APP/PlugIns/TellioTopShelf.appex/TellioTopShelf"
          zip -qry Tellio-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Tellio-unsigned-ipa
          path: Tellio-unsigned.ipa

      # Every build of main becomes a GitHub pre-release with the IPA attached,
      # so the latest one is always on the Releases page (and its download link).
      - name: Publish pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          TITLE="Tellio build ${{ github.run_number }}"
          git log -1 --format='%B' | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' > notes.md
          # The exact library versions in this build (AetherEngine's licence asks for this).
          python3 - >> notes.md <<'PY'
          import glob, json
          files = glob.glob("Tellio.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved")
          if files:
              pins = json.load(open(files[0])).get("pins", [])
              print("\n---\nThird-party components in this build:")
              for pin in sorted(pins, key=lambda p: p.get("identity", "")):
                  version = pin.get("state", {}).get("version") or pin.get("state", {}).get("revision", "")[:7]
                  print(f"- {pin.get('location', '').removesuffix('.git')} @ {version}")
          PY
          cp Tellio-unsigned.ipa Tellio.ipa
          gh release create "$TAG" Tellio.ipa \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes-file notes.md \
            --prerelease

      # The AltStore-format source that Apple TV sideloaders (ATVLoadly, FlareStore) read, listing
      # the newest builds. It lives alone on the altstore branch, so its raw address always holds
      # a complete file: https://raw.githubusercontent.com/MS2620/tellio/altstore/altstore-tvos.json
      - name: Update the AltStore source
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin altstore; then
            git worktree add -B altstore feed FETCH_HEAD
          else
            git worktree add --detach feed
            git -C feed switch --orphan altstore
          fi
          python3 Scripts/altstore-source.py tvos Tellio.ipa "build-${{ github.run_number }}" notes.md \
            feed/altstore-tvos.json feed/altstore-tvos.json
          git -C feed add altstore-tvos.json
          git -C feed commit -q -m "altstore-tvos.json for build ${{ github.run_number }}"
          git -C feed push origin altstore

  # Needs a paid Apple Developer account. Enable by setting the repository
  # variable ENABLE_TESTFLIGHT=true and adding the secrets listed in README.md.
  testflight:
    needs: build
    if: github.event_name != 'pull_request' && vars.ENABLE_TESTFLIGHT == 'true'
    runs-on: xcode-27  # AetherEngine needs Xcode 27
    env:
      KEY_PATH: ${{ github.workspace }}/../AuthKey.p8
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write App Store Connect API key
        run: echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$KEY_PATH"

      # Scramble the built-in TMDB token so it isn't plain text in the app file.
      # The app unscrambles it (AppSettings.builtInTMDBToken); TOKEN_MASK must match it there.
      - name: Scramble built-in keys
        env:
          TMDB_TOKEN_PLAIN: ${{ secrets.TMDB_TOKEN }}
          TOKEN_MASK: T3ll10-sh3lf-m4sk-2026
        run: |
          SCRAMBLED=$(python3 - <<'PY'
          import base64, os
          token, mask = os.environ.get("TMDB_TOKEN_PLAIN", "").strip().encode(), os.environ["TOKEN_MASK"].encode()
          print("x1:" + base64.b64encode(bytes(b ^ mask[i % len(mask)] for i, b in enumerate(token))).decode() if token else "")
          PY
          )
          # Keep it out of the public build logs too.
          [ -n "$SCRAMBLED" ] && echo "::add-mask::$SCRAMBLED"
          echo "TMDB_TOKEN_SCRAMBLED=$SCRAMBLED" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          VERSION="$(sed -n 's/^ *MARKETING_VERSION: "\([0-9]*\.[0-9]*\).*/\1/p' project.yml).${{ github.run_number }}"
          xcodebuild \
            -project Tellio.xcodeproj \
            -scheme Tellio \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath "$RUNNER_TEMP/Tellio.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="$VERSION" \
            TRAKT_CLIENT_ID="${{ secrets.TRAKT_CLIENT_ID }}" \
            TMDB_TOKEN="$TMDB_TOKEN_SCRAMBLED" \
            SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            FEEDBACK_URL="${{ secrets.FEEDBACK_URL }}" \
            archive

      - name: Export and upload to TestFlight
        run: |
          sed "s/TEAM_ID_PLACEHOLDER/${{ secrets.APPLE_TEAM_ID }}/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Tellio.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
