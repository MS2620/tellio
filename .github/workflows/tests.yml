name: Tests

# The addon listing matching checks (Tests/Matching). They build with plain swiftc on Linux,
# so they're quick and free, and run only when the code they cover changes.
on:
  pull_request:
    paths:
      - "Sources/Services/SportsMatching.swift"
      - "Sources/Services/SportsGuide.swift"
      - "Tests/**"
      - "Scripts/test-matching.sh"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "Sources/Services/SportsMatching.swift"
      - "Sources/Services/SportsGuide.swift"
      - "Tests/**"
      - "Scripts/test-matching.sh"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run the matching checks
        run: Scripts/test-matching.sh
