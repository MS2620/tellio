name: Tellio
options:
  bundleIdPrefix: com.mauro
  developmentLanguage: en
  deploymentTarget:
    tvOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Text the app shows comes from Localizable.xcstrings; building in Xcode adds new strings to it.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Filled by GitHub Actions from the TRAKT_CLIENT_ID secret; empty means "enter your own".
    TRAKT_CLIENT_ID: ""
    # Filled by GitHub Actions from the TMDB_TOKEN secret; empty means "enter your own".
    TMDB_TOKEN: ""
    # From the SENTRY_DSN secret; empty means no crash reports in that build.
    SENTRY_DSN: ""
    # From the FEEDBACK_URL secret (the backup server's address); empty means no feedback.
    FEEDBACK_URL: ""
    # Versions of the bundled libraries, for Settings › About › Acknowledgements. Filled by CI.
    LIBRARY_VERSIONS: ""
packages:
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    from: 7.66.1
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.0.0
targets:
  Tellio:
    type: application
    platform: tvOS
    sources: [Sources, Resources, Shared]
    dependencies:
      - package: AetherEngine
        product: AetherEngine
      - package: Sentry
        product: Sentry
      # Top Shelf: Continue Watching and live games on the Apple TV home screen
      - target: TellioTopShelf
    scheme: {}
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Tellio
        # The languages Tellio is translated into; it follows the Apple TV's language (Settings › General › Language).
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, de, fr, pt-PT, pl]
        # Without these the generator writes a fixed "1.0 (1)"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TraktClientID: $(TRAKT_CLIENT_ID)
        TMDBToken: $(TMDB_TOKEN)
        SentryDSN: $(SENTRY_DSN)
        FeedbackURL: $(FEEDBACK_URL)
        LibraryVersions: $(LIBRARY_VERSIONS)
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Many IPTV providers only serve plain http
          NSAllowsArbitraryLoads: true
        # Top Shelf cards open tellio:// links
        CFBundleURLTypes:
          - CFBundleURLName: com.mauro.tellio
            CFBundleURLSchemes: [tellio]
    entitlements:
      path: Config/Tellio.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mauro.tellio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mauro.tellio
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        GENERATE_INFOPLIST_FILE: NO

  TellioTopShelf:
    type: app-extension
    platform: tvOS
    sources: [TopShelf, Shared]
    info:
      path: Config/TopShelf-Info.plist
      properties:
        CFBundleDisplayName: Tellio Top Shelf
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, de, fr, pt-PT, pl]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    entitlements:
      path: Config/TellioTopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mauro.tellio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mauro.tellio.topshelf
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: NO
